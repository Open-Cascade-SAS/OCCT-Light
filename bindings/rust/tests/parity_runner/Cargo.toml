[package]
name        = "occtl-parity"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
description = "Parity-test runner for the Rust binding."
rust-version.workspace = true

[[bin]]
name = "parity_runner"
path = "src/main.rs"

[dependencies]
occtl      = { path = "../../src/occtl", version = "0.1.0" }
serde_json = "1"
